name: Reusable — E2E (Playwright)

# Standard E2E gate. Stack-agnostic: the caller passes `build_env_map`, a list
# of `BUILD_VAR=STANDARD_SECRET` pairs. This reusable exports each build var
# from the matching standard secret, so the framework never knows whether the
# build is Vite, Next, or anything else. Change stack -> change the map in the
# wrapper, not here.
#
# Preserves misfin's honest skip: if Playwright isn't installed or a required
# secret is empty, the job skips with a notice instead of failing red.

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "22"
      install_command:
        type: string
        default: "npm ci"
      e2e_command:
        type: string
        default: "npm run e2e"
      # Newline-separated BUILD_VAR=STANDARD_NAME pairs, e.g.
      #   VITE_SUPABASE_URL=BACKEND_URL
      #   VITE_SUPABASE_PUBLISHABLE_KEY=BACKEND_PUBLIC_KEY
      build_env_map:
        type: string
        default: ""
      # If this standard secret is empty, skip e2e (config, not a real failure).
      required_secret:
        type: string
        default: "BACKEND_URL"
    secrets:
      PACKAGES_TOKEN:
        required: false
      BACKEND_URL:
        required: false
      BACKEND_PUBLIC_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    env:
      # Standard secrets exposed to the job; the map step re-exports them under
      # the build's expected names.
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      BACKEND_PUBLIC_KEY: ${{ secrets.BACKEND_PUBLIC_KEY }}
      NPM_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Check prerequisites
        id: check
        env:
          REQUIRED_SECRET: ${{ inputs.required_secret }}
        run: |
          set -euo pipefail
          if ! node -e "const p=require('./package.json');process.exit((p.devDependencies?.['@playwright/test']||p.dependencies?.['@playwright/test'])?0:1)"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@playwright/test not in package.json; skipping E2E."
            exit 0
          fi
          # Indirect lookup of the required standard secret's value
          val="${!REQUIRED_SECRET:-}"
          if [ -z "$val" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$REQUIRED_SECRET is empty; skipping E2E."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Map standard secrets to build env vars
        if: steps.check.outputs.ready == 'true'
        env:
          BUILD_ENV_MAP: ${{ inputs.build_env_map }}
        run: |
          set -euo pipefail
          # For each BUILD_VAR=STANDARD_NAME, write BUILD_VAR=<value of STANDARD_NAME>
          # into $GITHUB_ENV so later steps (build/e2e) see the build's names.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            build_var="${line%%=*}"
            std_name="${line#*=}"
            std_value="${!std_name:-}"
            echo "${build_var}=${std_value}" >> "$GITHUB_ENV"
            echo "Mapped ${build_var} <- ${std_name}"
          done <<< "$BUILD_ENV_MAP"

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: ${{ inputs.install_command }}

      - name: Install Chromium
        if: steps.check.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        if: steps.check.outputs.ready == 'true'
        run: ${{ inputs.e2e_command }}

      - name: Upload Playwright report on failure
        if: failure() && steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
