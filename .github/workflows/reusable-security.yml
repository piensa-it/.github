name: Reusable — Security

# Standard DevSecOps baseline: secret scanning (Gitleaks) + SAST (Semgrep).
# Canonizes the pattern from app-misfin. Free tools only; no paid account.
# CodeQL is intentionally omitted (free only on public repos; private repos
# would need GitHub Advanced Security). See docs/QUALITY_GATE.md.

on:
  workflow_call:
    inputs:
      semgrep_configs:
        description: "Space-separated Semgrep rulesets"
        type: string
        default: "--config=p/default --config=p/typescript --config=p/react"
      semgrep_exclude_rules:
        description: "Optional --exclude-rule flags"
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (see quality-gate comment on mutable tags).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run Semgrep
        run: semgrep ci ${{ inputs.semgrep_configs }} ${{ inputs.semgrep_exclude_rules }}
        env:
          SEMGREP_RULES: p/default
