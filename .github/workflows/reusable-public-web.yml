name: Reusable — Public web

# Checks that the public pages of a product ship real HTML and their own SEO
# tags, the way crawlers and link previews see them (no JavaScript executed).
# Two modes, same script (scripts/public-web/check.mjs in this repo):
#
#   mode: dist — in the quality gate, after building. Blocks the merge.
#   mode: url  — after the production deploy, against the real domain.
#
# See docs/QUALITY_GATE.md ("Public web") and the landing-piensa skill.

on:
  workflow_call:
    inputs:
      mode:
        description: "dist (check the built folder) or url (check the deployed site)"
        type: string
        default: dist
      routes:
        description: "Comma/newline-separated public routes that must ship content, e.g. '/, /precios/'"
        type: string
        required: true
      client_routes:
        description: "Routes rendered in the browser (docs, app): only their tags are checked"
        type: string
        default: ""
      signature:
        description: "Text every <title> must contain. Empty disables it (only with a written reason in the wrapper)"
        type: string
        default: "by Piensa IT"
      min_text:
        description: "Minimum visible characters without JavaScript on content routes"
        type: number
        default: 400
      require_sitemap:
        type: boolean
        default: true
      # mode: dist
      node_version:
        type: string
        default: "22"
      install_command:
        type: string
        default: "npm ci"
      build_command:
        description: "Must produce the prerendered site (e.g. npm run build:web)"
        type: string
        default: "npm run build"
      publish_dir:
        type: string
        default: "dist"
      requires_packages_token:
        description: "true if npm ci needs the @piensa-it GitHub Packages token"
        type: boolean
        default: false
      # mode: url
      base_url:
        description: "Production domain, e.g. https://deliver.piensait.com"
        type: string
        default: ""
      wait_seconds:
        description: "url mode: seconds to wait for the CDN to serve the new deploy"
        type: number
        default: 20
      standard_ref:
        description: "Ref of piensa-it/.github that provides the check script. Keep it equal to the tag in `uses:`"
        type: string
        default: "v1"
    secrets:
      PACKAGES_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  public-web:
    name: Public web (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          BASE_URL: ${{ inputs.base_url }}
          NEEDS_TOKEN: ${{ inputs.requires_packages_token }}
          HAS_TOKEN: ${{ secrets.PACKAGES_TOKEN != '' }}
        run: |
          case "$MODE" in
            dist|url) ;;
            *) echo "::error::mode must be 'dist' or 'url' (got '$MODE')."; exit 1 ;;
          esac
          if [ "$MODE" = "url" ] && [ -z "$BASE_URL" ]; then
            echo "::error::mode: url needs base_url (the production domain)."; exit 1
          fi
          if [ "$MODE" = "dist" ] && [ "$NEEDS_TOKEN" = "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::requires_packages_token is true but PACKAGES_TOKEN was not passed. Set it in the repo's Actions secrets (docs/SECRETS.md) and pass it explicitly in the wrapper."; exit 1
          fi

      - name: Checkout standard (check script)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: piensa-it/.github
          ref: ${{ inputs.standard_ref }}
          path: .piensa-standard
          sparse-checkout: scripts/public-web

      - name: Checkout repository
        if: inputs.mode == 'dist'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: repo

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.mode == 'dist' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.mode == 'dist' && 'repo/package-lock.json' || '' }}

      - name: Install dependencies
        if: inputs.mode == 'dist'
        working-directory: repo
        run: ${{ inputs.install_command }}
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Build
        if: inputs.mode == 'dist'
        working-directory: repo
        run: ${{ inputs.build_command }}
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Wait for the CDN
        if: inputs.mode == 'url'
        env:
          WAIT: ${{ inputs.wait_seconds }}
        run: sleep "$WAIT"

      - name: Check public pages
        env:
          MODE: ${{ inputs.mode }}
          ROUTES: ${{ inputs.routes }}
          CLIENT_ROUTES: ${{ inputs.client_routes }}
          SIGNATURE: ${{ inputs.signature }}
          MIN_TEXT: ${{ inputs.min_text }}
          REQUIRE_SITEMAP: ${{ inputs.require_sitemap }}
          PUBLISH_DIR: ${{ inputs.publish_dir }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          args=(--routes "$ROUTES" --signature "$SIGNATURE" --min-text "$MIN_TEXT")
          [ -n "$CLIENT_ROUTES" ] && args+=(--client-routes "$CLIENT_ROUTES")
          [ "$REQUIRE_SITEMAP" = "true" ] || args+=(--no-sitemap)
          if [ "$MODE" = "dist" ]; then
            args+=(--dist "repo/$PUBLISH_DIR")
          else
            args+=(--base-url "$BASE_URL")
          fi
          node .piensa-standard/scripts/public-web/check.mjs "${args[@]}" | tee public-web.txt
          exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Public web (${{ inputs.mode }})"
            echo '```'
            cat public-web.txt 2>/dev/null || echo "(check did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
